<style>
  :root{

  canvas{position:fixed;inset:0;display:block;}

  .vignette{

  .topbar{

    padding:22px 28px;box-sizing:border-box;
  }
  .logo{color:var(--ink);font-weight:800;letter-spacing:.14em;font-size:15px;}
  .logo .accent{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .menu{color:var(--ink);opacity:.8;font-size:20px;border:1px solid rgba(255,255,255,.18);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;}

  .eyebrow{
    position:absolute;left:28px;top:34%;transform:translateY(-50%);
    color:rgba(230,230,240,.65);font-size:11px;letter-spacing:.22em;font-weight:600;
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:9px 16px;
    background:rgba(255,255,255,.03);
  }

  .headline{
    position:absolute;left:26px;top:calc(34% + 46px);margin:0;max-width:60vw;
    font-size:clamp(32px, 6vw, 74px);line-height:1.02;font-weight:800;letter-spacing:-0.01em;
  }
  .headline .solid{display:block;color:var(--ink);}
  .headline .outline{display:block;color:transparent;-webkit-text-stroke:1.4px rgba(245,244,250,.88);}
  .headline .accent2{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;}

  .cta{
    position:absolute;left:28px;top:calc(34% + 46px + 230px);pointer-events:auto;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--magenta));
    border:none;border-radius:12px;padding:16px 26px;color:#0a0812;font-weight:800;
    letter-spacing:.08em;font-size:12px;cursor:pointer;
  }

  .hint{
    position:absolute;left:28px;bottom:22px;color:rgba(230,230,240,.45);
    font-size:11px;letter-spacing:.04em;font-family:ui-monospace,Menlo,monospace;
  }

  #fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#8892b0;font-size:13px;z-index:10;text-align:center;padding:24px;box-sizing:border-box;}

  @media (max-width:640px){
    .headline{max-width:88vw;}
    .cta{top:calc(34% + 46px + 260px);}
  }
</style>

    'uniform sampler2D uBloom;',
    'void main(){',
    '  vec3 scene = texture2D(uScene, vUv).rgb;',
    '  vec3 bloom = texture2D(uBloom, vUv).rgb;',
    '  vec3 color = scene + bloom*0.95;',
    '  color = color/(color+vec3(1.0));',
    '  color = pow(color, vec3(0.9));',
    '  gl_FragColor = vec4(color, 1.0);',
    '}'
  ].join('\n');

  // ---------------------------------------------------------------
  // GL helpers
  // ---------------------------------------------------------------
  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.error('shader compile error:', gl.getShaderInfoLog(s));
    }
    return s;
  }
  function link(vsSrc, fsSrc){
    var vs = compile(gl.VERTEX_SHADER, vsSrc);
    var fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    var p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
      console.error('program link error:', gl.getProgramInfoLog(p));
    }
    return p;
  }

  var progPoint = link(VS_PARTICLE, FS_POINT);
  var progLine  = link(VS_PARTICLE, FS_LINE);
  var progStar  = link(VS_STAR, FS_STAR);
  var progBright = link(VS_QUAD, FS_BRIGHT);
  var progBlur   = link(VS_QUAD, FS_BLUR);
  var progComposite = link(VS_QUAD, FS_COMPOSITE);

  // ---------------------------------------------------------------
  // decode embedded particle data
  // ---------------------------------------------------------------
  function b64ToBytes(b64){
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function decodePose(bytes){
    var n = Math.floor(bytes.length/5);
    var xs = new Float32Array(n), ys = new Float32Array(n), ci = new Uint8Array(n);
    var dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    var xr = DATA.xrange, yr = DATA.yrange;
    for(var i=0;i<n;i++){
      var ux = dv.getUint16(i*5, true);
      var uy = dv.getUint16(i*5+2, true);
      var c  = dv.getUint8(i*5+4);
      xs[i] = xr[0] + (ux/65535)*(xr[1]-xr[0]);
      ys[i] = yr[0] + (uy/65535)*(yr[1]-yr[0]);
      ci[i] = c;
    }
    return {xs:xs, ys:ys, ci:ci};
  }

  var N = DATA.N;
  var poses = DATA.poseB64.map(function(b64){ return decodePose(b64ToBytes(b64)); });
  var palette = DATA.palette;

  var STRIDE_F = 13; // floats per particle
  var vertexData = new Float32Array(N*STRIDE_F);
  for(var i=0;i<N;i++){
    var o = i*STRIDE_F;
    vertexData[o+0]=poses[0].xs[i]; vertexData[o+1]=poses[0].ys[i];
    vertexData[o+2]=poses[1].xs[i]; vertexData[o+3]=poses[1].ys[i];
    vertexData[o+4]=poses[2].xs[i]; vertexData[o+5]=poses[2].ys[i];
    vertexData[o+6]=poses[3].xs[i]; vertexData[o+7]=poses[3].ys[i];
    vertexData[o+8]=Math.random();
    vertexData[o+9]=Math.random()<0.1 ? 1.0 : Math.random()*0.4;
    var c = palette[poses[0].ci[i]];
    vertexData[o+10]=c[0]/255; vertexData[o+11]=c[1]/255; vertexData[o+12]=c[2]/255;
  }

  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, vertexData, gl.STATIC_DRAW);

  var edgeBytes = b64ToBytes(DATA.edgesB64);
  var edgeCount = DATA.edgeCount;
  var edgeIdx = new Uint16Array(edgeCount*2);
  var edv = new DataView(edgeBytes.buffer, edgeBytes.byteOffset, edgeBytes.byteLength);
  for(var k=0;k<edgeCount;k++){
    edgeIdx[k*2]   = edv.getUint16(k*4, true);
    edgeIdx[k*2+1] = edv.getUint16(k*4+2, true);
  }
  var ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, edgeIdx, gl.STATIC_DRAW);

  var STRIDE_B = STRIDE_F*4;
  function bindParticleAttribs(prog){
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    var aAB = gl.getAttribLocation(prog,'aPoseAB');
    var aCD = gl.getAttribLocation(prog,'aPoseCD');
    var aM  = gl.getAttribLocation(prog,'aMeta');
    var aC  = gl.getAttribLocation(prog,'aColor');
    gl.enableVertexAttribArray(aAB); gl.vertexAttribPointer(aAB,4,gl.FLOAT,false,STRIDE_B,0);
    gl.enableVertexAttribArray(aCD); gl.vertexAttribPointer(aCD,4,gl.FLOAT,false,STRIDE_B,16);
    gl.enableVertexAttribArray(aM);  gl.vertexAttribPointer(aM,2,gl.FLOAT,false,STRIDE_B,32);
    gl.enableVertexAttribArray(aC);  gl.vertexAttribPointer(aC,3,gl.FLOAT,false,STRIDE_B,40);
  }

  // fullscreen quad
  var quadVbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  function drawQuad(prog, texMap, extraFn){
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
    var aP = gl.getAttribLocation(prog,'aPos');
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
    var unit=0;
    for(var name in texMap){
      gl.activeTexture(gl.TEXTURE0+unit);
      gl.bindTexture(gl.TEXTURE_2D, texMap[name]);
      gl.uniform1i(gl.getUniformLocation(prog,name), unit);
      unit++;
    }
    if(extraFn) extraFn(prog);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  // ---------------------------------------------------------------
  // framebuffers
  // ---------------------------------------------------------------
  function makeFBO(w,h){
    w = Math.max(1,w|0); h = Math.max(1,h|0);
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return {fbo:fbo, tex:tex, w:w, h:h};
  }
  function freeFBO(f){ if(f){ gl.deleteFramebuffer(f.fbo); gl.deleteTexture(f.tex); } }

  var sceneFBO, brightFBO, blurA, blurB;
  var W=1,H=1,DPR=1, originX=0, originY=0, figScale=1;
  var starVbo = gl.createBuffer();
  var STAR_N = 140;

  function buildStars(){
    var data = new Float32Array(STAR_N*5);
    for(var i=0;i<STAR_N;i++){
      var o=i*5;
      data[o+0]=Math.random()*W;
      data[o+1]=Math.random()*H;
      data[o+2]=Math.random();
      data[o+3]=Math.random();
      data[o+4]=Math.random();
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, starVbo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  }

  var resizeTimer = null;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 1.5);
    var cw = window.innerWidth, ch = window.innerHeight;
    W = Math.max(1, Math.floor(cw*DPR));
    H = Math.max(1, Math.floor(ch*DPR));
    canvas.width = W; canvas.height = H;
    canvas.style.width = cw+'px'; canvas.style.height = ch+'px';

    freeFBO(sceneFBO); freeFBO(brightFBO); freeFBO(blurA); freeFBO(blurB);
    sceneFBO = makeFBO(W,H);
    var hw = Math.max(1, Math.floor(W/2)), hh = Math.max(1, Math.floor(H/2));
    brightFBO = makeFBO(hw,hh);
    blurA = makeFBO(hw,hh);
    blurB = makeFBO(hw,hh);

    figScale = H*0.72;
    originX = W*0.68;
    originY = H*0.94 - figScale;

    buildStars();
  }
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  // ---------------------------------------------------------------
  // interaction + pose state
  // ---------------------------------------------------------------
  var mouse = {x:-99999, y:-99999};
  window.addEventListener('pointermove', function(e){
    mouse.x = e.clientX*DPR; mouse.y = e.clientY*DPR;
  });
  window.addEventListener('pointerleave', function(){ mouse.x=-99999; mouse.y=-99999; });

  var fromPose = 0, toPose = 1, cycleTimer = 0;
  var TRANSITION_MS = 1800, HOLD_MS = 5200;
  function advance(){
    fromPose = toPose;
    toPose = (toPose+1)%4;
    cycleTimer = 0;
  }
  window.addEventListener('pointerdown', function(){ advance(); });

  function setCommonUniforms(prog, te, timeSec){
    gl.uniform2f(gl.getUniformLocation(prog,'uResolution'), W, H);
    gl.uniform2f(gl.getUniformLocation(prog,'uOrigin'), originX, originY);
    gl.uniform1f(gl.getUniformLocation(prog,'uScale'), figScale);
    gl.uniform1f(gl.getUniformLocation(prog,'uTime'), timeSec);
    gl.uniform2f(gl.getUniformLocation(prog,'uMouse'), mouse.x, mouse.y);
    gl.uniform1i(gl.getUniformLocation(prog,'uFromIndex'), fromPose);
    gl.uniform1f(gl.getUniformLocation(prog,'uT'), te);
    gl.uniform1f(gl.getUniformLocation(prog,'uReduced'), reduced?1.0:0.0);
  }

  function blurPass(srcTex, dst, w, h, dx, dy){
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
    gl.viewport(0,0,w,h);
    drawQuad(progBlur, {uTex:srcTex}, function(p){
      gl.uniform2f(gl.getUniformLocation(p,'uDir'), dx, dy);
    });
  }

  var lastT = performance.now();
  var startT = lastT;

  function render(now){
    var dt = now-lastT; lastT = now;
    var timeSec = (now-startT)/1000;

    if(!reduced){
      cycleTimer += dt;
      if(cycleTimer > TRANSITION_MS+HOLD_MS){ advance(); }
    }
    var t = Math.min(1, cycleTimer/TRANSITION_MS);
    var te = t*t*(3.0-2.0*t);

    // pass 1: scene (additive particles/lines/stars) into full-res FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO.fbo);
    gl.viewport(0,0,W,H);
    gl.clearColor(3/255,2/255,8/255,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);

    gl.useProgram(progStar);
    gl.bindBuffer(gl.ARRAY_BUFFER, starVbo);
    var aPos = gl.getAttribLocation(progStar,'aPos');
    var aRand = gl.getAttribLocation(progStar,'aRand');
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,20,0);
    gl.enableVertexAttribArray(aRand); gl.vertexAttribPointer(aRand,3,gl.FLOAT,false,20,8);
    gl.uniform2f(gl.getUniformLocation(progStar,'uResolution'), W, H);
    gl.uniform1f(gl.getUniformLocation(progStar,'uTime'), timeSec);
    gl.drawArrays(gl.POINTS, 0, STAR_N);

    gl.useProgram(progLine);
    bindParticleAttribs(progLine);
    setCommonUniforms(progLine, te, timeSec);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
    gl.drawElements(gl.LINES, edgeCount*2, gl.UNSIGNED_SHORT, 0);

    gl.useProgram(progPoint);
    bindParticleAttribs(progPoint);
    setCommonUniforms(progPoint, te, timeSec);
    gl.uniform1f(gl.getUniformLocation(progPoint,'uPointBase'), 1.5);
    gl.drawArrays(gl.POINTS, 0, N);

    gl.disable(gl.BLEND);

    // pass 2: bright-pass extraction (half res)
    gl.bindFramebuffer(gl.FRAMEBUFFER, brightFBO.fbo);
    gl.viewport(0,0,brightFBO.w, brightFBO.h);
    drawQuad(progBright, {uTex: sceneFBO.tex});

    // pass 3: two-iteration separable blur
    blurPass(brightFBO.tex, blurA, brightFBO.w, brightFBO.h, 1/brightFBO.w, 0);
    blurPass(blurA.tex, blurB, blurA.w, blurA.h, 0, 1/blurA.h);
    blurPass(blurB.tex, blurA, blurB.w, blurB.h, 1/blurB.w, 0);
    blurPass(blurA.tex, blurB, blurA.w, blurA.h, 0, 1/blurA.h);

    // pass 4: composite scene + bloom to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,W,H);
    drawQuad(progComposite, {uScene: sceneFBO.tex, uBloom: blurB.tex});

    requestAnimationFrame(render);
  }

  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
